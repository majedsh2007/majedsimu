<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | المنصة التفاعلية للمحاكاة الفيزيائية</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1329;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:20px}
.card{width:min(430px,100%);background:#1c2541;border:1px solid #ffffff12;border-radius:20px;padding:34px;box-shadow:0 20px 60px #0008;text-align:center}
.logo{width:105px;height:105px;object-fit:contain;border-radius:50%;margin-bottom:14px}.title{color:#00b4d8;font-size:25px;margin:0 0 8px}.sub{color:#bbb;margin:0 0 25px;line-height:1.7}
label{display:block;text-align:right;margin:13px 0 7px;color:#ddd}input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #ffffff20;background:#0f1932;color:#fff;font-size:16px;outline:none}input:focus{border-color:#00b4d8}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#00b4d8;color:#07111f;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.msg{min-height:25px;margin-top:15px;color:#ff9f9f;line-height:1.6}.hint{font-size:13px;color:#999;margin-top:20px}
</style></head>
<body>
<div class="card">
  <img src="logo.png" class="logo" alt="الشعار">
  <h1 class="title">المنصة التفاعلية للمحاكاة الفيزيائية</h1>
  <p class="sub">تسجيل الدخول مطلوب للوصول إلى المحاكاة.</p>
  <form id="loginForm">
    <label for="username">اسم المستخدم</label><input id="username" autocomplete="username" required>
    <label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn">تسجيل الدخول</button>
    <div id="msg" class="msg"></div>
  </form>
  <div class="hint">يسمح الحساب بجلسة نشطة واحدة فقط في الوقت نفسه.</div>
</div>
<script>
(() => {
  const API_BASE = window.PHYSICS_AUTH_API || 'https://PUT-YOUR-WORKER-URL-HERE.workers.dev';
  const form=document.getElementById('loginForm'), btn=document.getElementById('loginBtn'), msg=document.getElementById('msg');
  const DEVICE_KEY='physics_auth_device', SESSION_KEY='physics_auth_session';
  let deviceId=localStorage.getItem(DEVICE_KEY);
  if(!deviceId){deviceId=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;localStorage.setItem(DEVICE_KEY,deviceId)}
  form.addEventListener('submit',async e=>{
    e.preventDefault(); msg.textContent=''; btn.disabled=true; btn.textContent='جارٍ التحقق...';
    try{
      const r=await fetch(API_BASE+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value,deviceId})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.message||'بيانات الدخول غير صحيحة');
      localStorage.setItem(SESSION_KEY,JSON.stringify({token:d.token}));
      location.href=new URLSearchParams(location.search).get('next')||'index.html';
    }catch(err){msg.textContent=err.message;btn.disabled=false;btn.textContent='تسجيل الدخول'}
  });
})();
</script>
</body></html>
