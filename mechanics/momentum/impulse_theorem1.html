<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محاكاة مبرهنة الزخم والدفع | الأستاذ ماجد شلالدة</title>
    <style>
        :root { --bg-color: #0b1329; --card-bg: #1c2541; --accent: #4cc9f0; --text: #ffffff; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-color); color: var(--text); padding: 20px; }
        .watermark { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://squarespace-cdn.com'); background-size: 180px; opacity: 0.02; pointer-events: none; z-index: 0; transform: rotate(-15deg) scale(1.2); }
        .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
        .btn { text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; border: 1px solid var(--accent); color: var(--accent); display: inline-block; margin-bottom: 20px; }
        .sim-box { background: var(--card-bg); border-radius: 12px; padding: 30px; text-align: center; }
        .control-group { margin: 20px 0; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .control-group input { padding: 10px; border-radius: 6px; border: 1px solid #3a506b; background: #0b1329; color: #fff; width: 120px; text-align: center; }
        .result-box { font-size: 1.6rem; color: var(--accent); margin-top: 25px; padding: 15px; background: rgba(76, 201, 240, 0.1); border-radius: 8px; line-height: 1.8; }
    </style>
</head>
<body>
    <div class="watermark"></div>
    <div class="container">
        <a href="momentum.html" class="btn">⬅ العودة للزخم الخطي</a>
        <div class="sim-box">
            <h1>🔨 محاكاة مبرهنة الزخم - الدفع (I = F · Δt)</h1>
            <p>إعداد الأستاذ ماجد شلالدة</p>
            <div class="control-group">
                <label>القوة المؤثرة (F) بنيوتن:<br><input type="number" id="force" value="20" oninput="calc()"></label>
                <label>زمن التلامس (Δt) بالثانية:<br><input type="number" id="time" value="0.5" oninput="calc()"></label>
            </div>
            <div class="result-box" id="result">الدفع الناتج (I) = 10 نيوتن·ث<br>التغير في الزخم الخطي (ΔP) = 10 كغم·م/ث</div>
        </div>
    </div>
    <script>
        function calc() {
            let f = parseFloat(document.getElementById('force').value) || 0;
            let t = parseFloat(document.getElementById('time').value) || 0;
            let impulse = f * t;
            document.getElementById('result').innerHTML = `الدفع الناتج (I) = ${impulse.toFixed(2)} نيوتن·ث<br>التغير في الزخم الخطي (ΔP) = ${impulse.toFixed(2)} كغم·م/ث`;
        }
    </script>
</body>
</html>
