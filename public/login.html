<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | المنصة التفاعلية</title>
<style>
:root{--bg:#0b1329;--card:#1c2541;--accent:#00b4d8;--muted:#d4d9e2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:20px}
.box{width:min(430px,100%);background:var(--card);border-radius:20px;padding:32px;box-shadow:0 20px 60px #0008;text-align:center;border:1px solid #fff2}
.logo{width:110px;height:110px;border-radius:50%;object-fit:contain;margin-bottom:8px}h1{font-size:1.7rem;color:var(--accent);margin:8px 0}p{color:var(--muted);margin:8px 0 22px}
input{width:100%;padding:14px;margin:7px 0;border:1px solid #fff2;border-radius:10px;background:#0f1933;color:#fff;font-size:16px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;background:var(--accent);font-size:17px;font-weight:700;cursor:pointer}
#error{min-height:24px;color:#ff8585;margin-top:10px}
</style></head>
<body><div class="box">
<img class="logo" src="/login-logo.png" alt="شعار الأستاذ ماجد شلالدة">
<h1>تسجيل الدخول</h1><p>المنصة التفاعلية للمحاكاة الفيزيائية</p>
<form id="form"><input id="username" autocomplete="username" placeholder="اسم المستخدم" required>
<input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required>
<button type="submit">دخول</button><div id="error" aria-live="polite"></div></form>
</div>
<script>
form.addEventListener("submit",async e=>{
 e.preventDefault(); error.textContent="";
 try{
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:username.value,password:password.value})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error||"تعذر تسجيل الدخول");
  location.replace("/");
 }catch(e){error.textContent=e.message;password.value="";password.focus();}
});
</script></body></html>
