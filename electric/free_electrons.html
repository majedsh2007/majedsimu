    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .title-header {
            position: relative;
            width: min(900px, 100%);
            margin: 0 auto 8px;
            padding: 10px 20px 8px;
            box-sizing: border-box;
            overflow: hidden;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(246,249,252,0.94));
            box-shadow: 0 5px 18px rgba(0,0,0,0.07);
        }
        .title-header h1,
        .title-header .author-credit {
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 2px rgba(255,255,255,0.9);
        }

        .author-credit {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1f6fb2;
            margin: 2px 0 12px;
            letter-spacing: .2px;
        }
        .description {
            color: #555;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            font-size: 1rem;
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #btn-off {
            background-color: #e74c3c;
            color: white;
        }
        #btn-on {
            background-color: #2ecc71;
            color: white;
            opacity: 0.6;
        }
        #btn-off.active, #btn-on.active {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .status-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 15px 0;
            color: #2980b9;
        }
        #simulation-container {
            position: relative;
            width: 800px;
            max-width: 100%;
            height: 350px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            isolation: isolate;
        }
        canvas {
            display: block;
            background: transparent;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
        }

        /* أزرار التنقل */
        .nav-buttons {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 10000;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-buttons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(135deg, #1f6fb2, #15558b);
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.18);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            white-space: nowrap;
        }

        .nav-buttons a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.24);
            background: linear-gradient(135deg, #15558b, #0f426c);
        }

        .nav-buttons a:active {
            transform: translateY(0);
        }

        @media (max-width: 650px) {
            .nav-buttons {
                top: 8px;
                right: 8px;
                flex-direction: column;
                align-items: stretch;
            }

            .nav-buttons a {
                font-size: 0.78rem;
                padding: 7px 10px;
            }
        }

        const btnOff = document.getElementById('btn-off');
        const btnOn = document.getElementById('btn-on');

        let mode = 'off'; // 'off' أو 'on'
        let electrons = [];
        let atoms = [];
        const numElectrons = 35;
        const numAtomsX = 6;
        const numAtomsY = 3;

        // إنشاء ذرات الفلز الثابتة (الشبكة البلورية)
        function initAtoms() {
            atoms = [];
            const stepX = canvas.width / (numAtomsX + 1);
            const stepY = (canvas.height - 100) / (numAtomsY + 1);
            for (let i = 1; i <= numAtomsX; i++) {
                for (let j = 1; j <= numAtomsY; j++) {
                    atoms.push({
                        x: i * stepX,
                        y: 50 + (j * stepY),
                        radius: 18
                    });
                }
            }
        }

        // إنشاء الإلكترونات الحرة بحركات عشوائية أولية
        function initElectrons() {
            electrons = [];
            for (let i = 0; i < numElectrons; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 2 + Math.random() * 2; // سرعة الحركة الحرارية العشوائية
                electrons.push({
                    x: Math.random() * (canvas.width - 40) + 20,
                    y: Math.random() * (canvas.height - 140) + 70,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 5,
                    color: '#00d2ff'
                });
            }
        }

        // تغيير حالة الدارة
        function setMode(newMode) {
            mode = newMode;
            if (mode === 'off') {
                btnOff.classList.add('active');
                btnOn.classList.remove('active');
                statusText.innerText = "الحالة الحالية: حركة عشوائية حرارية وتصادمات مستمرة (المحصلة = صفر)";
                statusText.style.color = "#2980b9";
                // إعادة عشوائية كاملة للسرعات
                electrons.forEach(e => {
                    let angle = Math.random() * Math.PI * 2;
                    let speed = 2 + Math.random() * 2;
                    e.vx = Math.cos(angle) * speed;
                    e.vy = Math.sin(angle) * speed;
                });
            } else {
                btnOn.classList.add('active');
                btnOff.classList.remove('active');
                statusText.innerText = "الحالة الحالية: نشوء مجال كهربائي يوجه الإلكترونات (سرعة الانجراف نحو القطب الموجب)";
                statusText.style.color = "#2ecc71";
            }
        }

        // تحديث حركة العناصر ورسمها
        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. رسم السلك وحدوده
            ctx.strokeStyle = '#7f8c8d';
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 50, canvas.width - 20, canvas.height - 100);
            
            // خلفية السلك الداخلي
            ctx.fillStyle = '#eef2f7';
            ctx.fillRect(12, 52, canvas.width - 24, canvas.height - 104);

            // شعار الأستاذ ماجد شلالده كعلامة مائية داخل الموصل: شفاف وخلف الذرات والإلكترونات
            // حتى تبقى واضحة دون أن تحجب تفاصيل المحاكاة.
            if (watermarkImg.complete) {
                ctx.save();
                ctx.globalAlpha = 0.12;
                ctx.globalCompositeOperation = 'multiply';
                const wmW = 185;
                const wmH = 185;
                const wmX = (canvas.width - wmW) / 2;
                const wmY = (canvas.height - wmH) / 2;
                ctx.drawImage(watermarkImg, wmX, wmY, wmW, wmH);
                ctx.restore();
            }

            // 2. رسم الأقطاب عند التوصيل
            if (mode === 'on') {
                ctx.fillStyle = '#1565c0'; // القطب السالب باللون الأزرق على اليسار
                ctx.fillRect(10, 52, 5, canvas.height - 104);
                ctx.fillStyle = '#e53935'; // القطب الموجب باللون الأحمر على اليمين
                ctx.fillRect(canvas.width - 15, 52, 5, canvas.height - 104);
                
                // علامات الأقطاب: تظهر بوضوح عند التوصيل
                ctx.save();
                ctx.font = 'bold 30px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // القطب السالب
                ctx.fillStyle = '#1565c0';
                ctx.fillText('−', 27, 35);

                // القطب الموجب
                ctx.fillStyle = '#e53935';
                ctx.fillText('+', canvas.width - 27, 35);

                ctx.font = 'bold 13px Arial, sans-serif';
                ctx.fillStyle = '#1565c0';
                ctx.fillText('سالب', 38, 22);
                ctx.fillStyle = '#e53935';
                ctx.fillText('موجب', canvas.width - 38, 22);
                ctx.restore();
            }

            // رسم خطوط المجال الكهربائي الثابتة داخل الموصل عند التوصيل
        function drawElectricFieldLines() {
            if (mode !== 'on') return;

            ctx.save();
            ctx.strokeStyle = 'rgba(231, 76, 60, 0.85)';
            ctx.fillStyle = 'rgba(231, 76, 60, 0.95)';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';

            const startX = 45;
            const endX = canvas.width - 45;
            const arrowSize = 7;

            // خطوط ثابتة، واتجاه المجال من القطب الموجب على اليمين إلى القطب السالب على اليسار
            for (let y = 85; y <= canvas.height - 85; y += 45) {
                ctx.beginPath();
                ctx.moveTo(startX, y);
                ctx.lineTo(endX, y);
                ctx.stroke();

                // سهم ثابت في منتصف كل خط
                const midX = (startX + endX) / 2;
                ctx.beginPath();
                ctx.moveTo(midX + arrowSize, y - arrowSize);
                ctx.lineTo(midX - arrowSize, y);
                ctx.lineTo(midX + arrowSize, y + arrowSize);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }

        // 3. رسم الأيونات/الذرات الثابتة ذات الشحنة الموجبة
            // خطوط المجال الكهربائي الثابتة (تظهر فقط عند التوصيل)
            drawElectricFieldLines();

            atoms.forEach(atom => {
                // ظل خفيف أسفل الذرة لإعطاء إحساس بالارتفاع عن السطح
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(atom.x + 3, atom.y + 5, atom.radius * 0.92, atom.radius * 0.38, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.18)';
                ctx.filter = 'blur(2px)';
                ctx.fill();
                ctx.restore();

                // كرة ثلاثية الأبعاد بتدرج شعاعي: إضاءة أعلى اليسار وتغميق عند الحواف
                const g = ctx.createRadialGradient(
                    atom.x - atom.radius * 0.38,
                    atom.y - atom.radius * 0.42,
                    atom.radius * 0.08,
                    atom.x,
                    atom.y,
                    atom.radius * 1.08
                );
                g.addColorStop(0, '#fff3d6');
                g.addColorStop(0.18, '#ffd27a');
                g.addColorStop(0.48, '#e67e22');
                g.addColorStop(0.78, '#b9570e');
                g.addColorStop(1, '#713300');

                ctx.beginPath();
                ctx.arc(atom.x, atom.y, atom.radius, 0, Math.PI * 2);
                ctx.fillStyle = g;
                ctx.fill();

                // حافة لامعة لتعزيز الشكل الكروي
                ctx.lineWidth = 1.8;
                ctx.strokeStyle = 'rgba(255,255,255,0.72)';
                ctx.stroke();

                // انعكاس ضوئي صغير
                const shine = ctx.createRadialGradient(
                    atom.x - atom.radius * 0.42,
                    atom.y - atom.radius * 0.48,
                    0,
                    atom.x - atom.radius * 0.42,
                    atom.y - atom.radius * 0.48,
                    atom.radius * 0.42
                );
                shine.addColorStop(0, 'rgba(255,255,255,0.70)');
                shine.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.beginPath();
                ctx.arc(atom.x, atom.y, atom.radius * 0.96, 0, Math.PI * 2);
                ctx.fillStyle = shine;
                ctx.fill();

                // إشارة الموجب داخل النواة
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.35)';
                ctx.shadowBlur = 2;
                ctx.fillText('+', atom.x, atom.y);
                ctx.shadowBlur = 0;
            });

            // 4. تحديث ورسم الإلكترونات الحرة
            electrons.forEach(e => {
                // إذا كان المفتاح مغلق (توصيل بفرق جهد)، تضاف "سرعة انجراف" باتجاه اليسار (القطب الموجب)
                if (mode === 'on') {
                    e.vx += 0.15; // قوة انجراف الإلكترونات نحو القطب الموجب على اليمين
                    // تحديد السرعة القصوى للانجراف لكي لا يتسارع الإلكترون بشكل لا نهائي بسبب التصادمات
                    if (e.vx > 5) e.vx = 5; 
                }

                // تحديث الموقع الحالي
                e.x += e.vx;
                e.y += e.vy;

                // الارتداد عن جدران السلك العلوية والسفلية
                if (e.y - e.radius < 52 || e.y + e.radius > canvas.height - 52) {
                    e.vy = -e.vy;
                }

                // في الحالة العشوائية (قبل التوصيل) يرتد عن الجوانب
                if (mode === 'off') {
                    if (e.x - e.radius < 12 || e.x + e.radius > canvas.width - 12) {
                        e.vx = -e.vx;
                    }
                } else {
                    // في حالة التوصيل، الإلكترون الذي يخرج من اليسار (+) يعود يدخل من اليمين (-) لمحاكاة الدارة المغلقة
                    if (e.x > canvas.width - 12) {
                        e.x = 15;
                        e.y = Math.random() * (canvas.height - 140) + 70;
                        e.vx = 2 + Math.random() * 2; // يكمل الحركة نحو اليمين
                    }
                }

                // محاكاة التصادم مع الذرات الثابتة الفلزية
                atoms.forEach(atom => {
                    let dx = e.x - atom.x;
                    let dy = e.y - atom.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    // حدوث تصادم عند ملامسة سطح الذرة
                    if (distance < atom.radius + e.radius) {
                        // زاوية الارتداد العشوائي بعد التصادم
                        let angle = Math.atan2(dy, dx) + (Math.random() * 0.4 - 0.2);
                        let speed = Math.sqrt(e.vx * e.vx + e.vy * e.vy);
                        
                        // تغيير اتجاه الإلكترون فوراً بناءً على التصادم
                        e.vx = Math.cos(angle) * speed;
                        e.vy = Math.sin(angle) * speed;
                        
                        // دفع الإلكترون قليلاً للخارج لمنع الالتصاق بالذرة
                        e.x = atom.x + Math.cos(angle) * (atom.radius + e.radius + 1);
                        e.y = atom.y + Math.sin(angle) * (atom.radius + e.radius + 1);
                    }
                });

                // رسم الإلكترون ككرة زرقاء صغيرة مشعة
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = e.color;
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            requestAnimationFrame(update);
        }

        // بدء المحاكاة
        initAtoms();
        initElectrons();
        update();
    </script>
